name: Build Android APK

on:
  push:
    branches: [ "claude/bluetooth-hearing-aid-recorder-shmsxj" ]
    paths:
      - "hearing-companion/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearing-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearing-companion-debug
          path: hearing-companion/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Hearing Companion — latest debug build
          body: "Install this APK on your Android phone. Settings may ask you to allow installing from this source."
          files: hearing-companion/app/build/outputs/apk/debug/app-debug.apk
